<script>
/* ===== 設定値（体験用の概算。calc.js の30年試算とは別物） =====
   sellPrice : 売電単価（円/kWh）※仮の値。変更はここだけ */
window.FLOW_CONFIG = { sellPrice: 15 };

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090c}
a{color:#f4f5f6;text-decoration:none}a:hover{color:#ffffff}
@keyframes dash{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sheen{0%{transform:translateX(-300px)}55%,100%{transform:translateX(560px)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,70%,100%{opacity:.15}80%{opacity:1}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}50%{box-shadow:0 0 22px 2px rgba(255,181,71,.35)}}
.p{stroke-dasharray:0 18;stroke-linecap:round;fill:none;animation-name:dash;animation-timing-function:linear;animation-iteration-count:infinite;transition:opacity .4s}
.slow{animation-duration:4.5s}.mid{animation-duration:3.5s}.fast{animation-duration:2.6s}
.off{opacity:0}
.rev{animation-direction:reverse}
.chip{transition:opacity .4s}
.halo{animation:pulse 3s ease-in-out infinite}
.tw{animation:twinkle 3.2s ease-in-out infinite}
.sheen{animation:sheen 6s ease-in-out infinite}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.fan{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
.beacon{animation:blink 2.4s ease-in-out infinite}
.fade{transition:opacity .5s}
.bar{transition:width .35s ease}
.appl{transition:background-color .25s,border-color .25s,color .25s,transform .15s}
.appl:hover{transform:translateY(-1px)}
.appl:active{transform:scale(.97)}
.appl[aria-pressed=true]{animation:breathe 2.6s ease-in-out infinite}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#2b333c}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:#f4f5f6;box-shadow:0 0 0 6px rgba(255,181,71,.25),0 0 18px rgba(255,181,71,.6)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#2b333c}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#f4f5f6}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #FFB547;outline-offset:2px}
</style>
<style>html,body{height:100%;overflow:hidden} sc-if,sc-for{display:contents}</style>
<style>

html[data-look="clean"] #lookSwitch button[aria-pressed="true"]{background:#1d1d1f;color:#fff}

html[data-look="clean"] aside [style*="color: #aab2bb"]{color:#6e6e73 !important}
html[data-look="clean"] aside [style*="color: #7d8792"]{color:#86868b !important}
html[data-look="clean"] aside [style*="color: #FFB547"]{color:#C26A00 !important}
html[data-look="clean"] aside [style*="color: #5BC0F8"]{color:#0071E3 !important}
html[data-look="clean"] aside [style*="color: #FF7A66"]{color:#D63B2A !important}
html[data-look="clean"] aside [style*="background: #1c232b"]{background:#e5e5ea !important}
html[data-look="clean"] aside [style*="background: #E9EDF1"]{background:#1d1d1f !important;box-shadow:none !important}
html[data-look="clean"] aside [style*="background: #f1f3f5"]{background:#fff8ee !important;border:1px solid #f5ddb8}
html[data-look="clean"] aside svg line[stroke="#2b333c"], html[data-look="clean"] aside svg line[stroke="#1c232b"]{stroke:#e5e5ea}
html[data-look="clean"] aside svg path[stroke="#E9EDF1"]{stroke:#1d1d1f}
html[data-look="clean"] aside svg circle[fill="#E9EDF1"], html[data-look="clean"] aside svg text[fill="#E9EDF1"]{fill:#1d1d1f}
html[data-look="clean"] aside svg line[stroke="#ffffff"]{stroke:#1d1d1f}
html[data-look="clean"] aside svg text[fill="#5BC0F8"]{fill:#0071E3}

/* 情景の上に乗るパネル（すりガラスを白に） */
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.72)"]{background:rgba(255,255,255,.82) !important;border-color:rgba(0,0,0,.06) !important;box-shadow:0 8px 24px rgba(0,0,0,.08)}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.72)"] span{color:#6e6e73 !important}
html[data-look="clean"] section [role="group"]{background:#ececf0 !important}
html[data-look="clean"] section [role="group"] button[aria-pressed="false"]{color:#424245 !important}
html[data-look="clean"] section [role="group"] button[aria-pressed="true"]{background:#1d1d1f !important;color:#fff !important}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"]{background:rgba(255,255,255,.88) !important;box-shadow:0 12px 32px rgba(0,0,0,.10) !important}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"] [style*="color: #aab2bb"], html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"] [style*="color: #c3c9d0"]{color:#6e6e73 !important}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"] [style*="background: #151b22"]{background:#e5e5ea !important}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"] [style*="background: #E9EDF1"]{background:#1d1d1f !important}
html[data-look="clean"] .appl[aria-pressed="false"]{background:rgba(255,255,255,.85) !important;border-color:rgba(0,0,0,.08) !important;color:#424245 !important}
html[data-look="clean"] .appl[aria-pressed="false"] > span:first-child{background:#ececf0 !important}
html[data-look="clean"] .appl[aria-pressed="true"]{background:#fff6e8 !important;color:#8a4b00 !important}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"] [style*="color: #5BC0F8"]{color:#0071E3 !important}
html[data-look="clean"] section > div[style*="rgba(10,13,17,0.82)"] [style*="color: #FFB547"]{color:#C26A00 !important}

<span style="font-size: 11px; line-height: 1.6; color: #4a525b">電気代は昼間単価44.40円＋再エネ賦課金4.18円/kWh、売電は{{sellPriceLabel}}円/kWh（仮の値）で概算。SBIリースなら、売電収入は1〜30年目までお客様のものです。</span>

<script>
/* デザイン案（design-mock/Flow）の画面をそのまま動かすための小さな描画エンジン */
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(u) {
    Object.assign(this.state, typeof u === 'function' ? u(this.state) : u);
    scheduleUpdate();
  }
}

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { hour: 12, mode: 'lease', cap: 6, weather: 'sun', life: 'away', playing: false,
evTime: 'none', ecoTime: 'day', ovr: {} };
this.timer = null;
}
componentWillUnmount() {
if (this.timer) clearInterval(this.timer);
}
renderVals() {
const s = this.state;
const H = s.hour;
const cap = s.cap;
const wf = s.weather === 'sun' ? 1 : 0.35;
const sellPrice = this.props.sellPrice ?? 15;
const buyUnit = 44.40 + 4.18;
const isLease = true;

const APPL = [
{ key: 'bedAc', label: '寝室エアコン', kw: 0.6, left: '216px', top: '400px', icon: 'M3 6h18v7H3z M7 17c0 1.5-1 2.5-1 2.5 M12 17v2.5 M17 17c0 1.5 1 2.5 1 2.5' },
{ key: 'ih', label: 'IH調理', kw: 2.0, left: '212px', top: '504px', icon: 'M4 7h16v12H4z M9 13m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0 M17 13m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0' },
{ key: 'lvAc', label: 'リビングエアコン', kw: 0.8, left: '380px', top: '498px', icon: 'M3 6h18v7H3z M7 17c0 1.5-1 2.5-1 2.5 M12 17v2.5 M17 17c0 1.5 1 2.5 1 2.5' },
{ key: 'tv', label: 'テレビ', kw: 0.15, left: '380px', top: '548px', icon: 'M3 5h18v11H3z M9 20h6' },
{ key: 'ev', label: 'EV充電', kw: 3.0, left: '712px', top: '606px', icon: 'M13 3L5 14h6l-1 7 8-11h-6z' },
{ key: 'eco', label: 'エコキュート', kw: 1.5, left: '24px', top: '430px', icon: 'M8 3h8v18H8z M12 8c-1.5 2-1.5 3.5 0 5 1.5-1.5 1.5-3 0-5z' }
];
// 暮らし方ごとの家電の使用時間帯（体験用の想定）
const home = s.life === 'home';
const win = (h, ranges) => ranges.some((r) => h >= r[0] && h < r[1]);
const SCHED = {
bedAc: [[0, 6.5], [22, 24]],
ih: home ? [[6.5, 7.2], [11.5, 12.5], [18.5, 19.5]] : [[6.5, 7.2], [18.5, 19.5]],
lvAc: home ? [[6.5, 23]] : [[6.5, 8], [17.5, 23]],
tv: home ? [[7, 8], [12, 13], [19, 23]] : [[7, 8], [19, 23]],
ev: s.evTime === 'day' ? [[10, 14]] : s.evTime === 'night' ? [[0, 4]] : [],
eco: s.ecoTime === 'day' ? [[10, 13]] : [[1, 4]]
};
const kwOf = {};
APPL.forEach((a) => { kwOf[a.key] = a.kw; });
const isOn = (key, h) => {
const o = s.ovr[key];
if (o && h >= o.from && h < o.to) return o.v;
return win(h, SCHED[key]);
};
// 普段の家電はベースの曲線に含まれる。ボタンで普段と違う使い方をした分だけ増減する
// 家電の立ち上がり・立ち下がりは約30分かけてなめらかに変化させる
const SHIFT = { ev: 1, eco: 1 };
const sig = (x) => 1 / (1 + Math.exp(-x));
const soft = (h, r) => sig((h - r[0]) / 0.25) * sig((r[1] - h) / 0.25);
const softWin = (h, ranges) => Math.min(1, ranges.reduce((m, r) => m + soft(h, r), 0));
const onW = (key, h) => {
const base = SHIFT[key] ? softWin(h, SCHED[key]) : 0;
const o = s.ovr[key];
if (!o) return base;
const target = SHIFT[key] ? (o.v ? 1 : 0) : (o.v ? 1 : 0) - (win(h, SCHED[key]) ? 1 : 0);
return base + (target - base) * soft(h, [o.from, o.to]);
};
const applLoad = (h) => APPL.reduce((sum, a) => sum + onW(a.key, h) * a.kw, 0);

const gen = (h) => (h <= 5.5 || h >= 18.5) ? 0 : cap * 0.8 * wf * Math.sin(Math.PI * (h - 5.5) / 13);
// 一般家庭の典型的な1日（深夜は冷蔵庫・待機電力のみ、朝7時と夜20時前後にピーク）
const bump = (h, mu, sd, a) => a * Math.exp(-((h - mu) * (h - mu)) / (2 * sd * sd));
const baseLoad = (h) => home
? 0.3 + bump(h, 7, 0.9, 0.8) + bump(h, 12.5, 2.6, 0.45) + bump(h, 19.5, 1.9, 1.3)
: 0.3 + bump(h, 7, 0.8, 0.9) + bump(h, 19.5, 1.8, 1.4);
const load = (h) => Math.max(0.2, baseLoad(h) + applLoad(h));

const hNow = Math.min(H, 23.99);
const g = gen(hNow), l = load(hNow);
const e = isOn('eco', hNow) ? 1.5 : 0;
const evNow = isOn('ev', hNow);
const self = Math.min(g, l), sell = Math.max(0, g - l), buy = Math.max(0, l - g);

let selfT = 0, sellT = 0, buyT = 0;
for (let t = 0.125; t < H; t += 0.25) {
const gg = gen(t), ll = load(t);
selfT += Math.min(gg, ll) * 0.25;
sellT += Math.max(0, gg - ll) * 0.25;
buyT += Math.max(0, ll - gg) * 0.25;
}

let maxV = 0;
for (let t = 0; t <= 24; t += 0.25) { maxV = Math.max(maxV, gen(t), load(t)); }
maxV = maxV * 1.1;
const X = (t) => (t / 24 * 416).toFixed(1);
const Y = (v) => (118 - v / maxV * 110).toFixed(1);
let area = 'M 0 118';
let line = '';
for (let t = 0; t <= 24.001; t += 0.25) {
area += ' L ' + X(t) + ' ' + Y(gen(t));
line += (line ? ' L ' : 'M ') + X(t) + ' ' + Y(load(t));
}
area += ' L 416 118 Z';

const A = [186, 318], B = [648, 376], C = [682, 342], D = [220, 284];
const lp = (p, q, k) => (p[0] + (q[0] - p[0]) * k).toFixed(1) + ' ' + (p[1] + (q[1] - p[1]) * k).toFixed(1);
let grid = '';
for (let i = 1; i < 10; i++) grid += 'M ' + lp(A, B, i / 10) + ' L ' + lp(D, C, i / 10) + ' ';
grid += 'M ' + lp(A, D, 0.5) + ' L ' + lp(B, C, 0.5);
let cells = '';
for (let i = 1; i < 40; i++) if (i % 4) cells += 'M ' + lp(A, B, i / 40) + ' L ' + lp(D, C, i / 40) + ' ';
for (let j = 1; j < 6; j++) if (j !== 3) cells += 'M ' + lp(A, D, j / 6) + ' L ' + lp(B, C, j / 6) + ' ';

const tt = (H - 6) / 12;
const day = tt > 0 && tt < 1;
const elev = day ? Math.sin(Math.PI * tt) : 0;
const sunX = (460 - 400 * Math.cos(Math.PI * Math.max(0, Math.min(1, tt)))).toFixed(1);
const sunY = (600 - 460 * elev).toFixed(1);
const mix = (a, b, k) => Math.round(a + (b - a) * k);
const rgb = (a, b, c) => 'rgb(' + a + ',' + b + ',' + c + ')';
const k = Math.pow(elev, 0.6);
const dusk = day ? Math.max(0, 1 - elev * 2.2) : 0;
// 昼は澄んだ青空、朝夕は地平線が暖色に、夜は黒に近い紺
const skyTop = rgb(mix(4, 22, k), mix(6, 74, k), mix(10, 140, k));
const skyMid = rgb(mix(8, 62, k), mix(11, 128, k), mix(16, 196, k));
const skyBot = rgb(mix(mix(10, 150, k), 236, dusk * 0.55), mix(mix(14, 196, k), 150, dusk * 0.55), mix(mix(20, 228, k), 90, dusk * 0.55));

const cls = (v) => v < 0.05 ? 'p off' : v < 0.8 ? 'p slow' : v < 2 ? 'p mid' : 'p fast';
const op = (v) => v < 0.05 ? 0 : 1;
const dur = (v) => v < 0.8 ? '6s' : v < 2 ? '5s' : '4s';
const f1 = (v) => v.toFixed(1);
const kw = (v) => v.toFixed(1) + ' kW';
const yen = (v) => '¥' + Math.round(v).toLocaleString('ja-JP');
const pct = (v) => Math.min(100, Math.round(v / (cap * 0.8) * 100)) + '%';
const halfPct = (v) => Math.min(50, v / 5 * 50).toFixed(1) + '%';

const hh = Math.floor(H), mm = Math.round((H - hh) * 60);
const clock = hh + ':' + (mm < 10 ? '0' : '') + mm;

let story, meterLabel, meterColor, meterKw;
if (g < 0.05) { story = '発電はお休み中。家の電気はすべて電力会社から買っています。'; }
else if (sell >= 0.05) {
if (!isLease) story = '余った電気は売電へ。ただしPPAでは、その収入はPPA事業者のものです。';
else if (s.ecoTime === 'night' || s.evTime === 'night') story = '余った電気は売電へ。エコキュートやEVを昼に動かすと、もっと家で使えます。';
else story = '余った電気は売電へ。その収入は、お客様のものです。';
}
else if (buy >= 0.05) { story = '発電だけでは足りない分を、電力会社から買っています。'; }
else { story = '発電した電気を、家の中でちょうど使いきっています。'; }
if (sell >= 0.05) { meterLabel = '売電中'; meterColor = '#5BC0F8'; meterKw = kw(sell); }
else if (buy >= 0.05) { meterLabel = '買電中'; meterColor = '#FF7A66'; meterKw = kw(buy); }
else { meterLabel = '自給中'; meterColor = '#FFB547'; meterKw = kw(self); }

const lit = (v) => v ? (day ? 0.5 : 0.85) : (day ? 0.03 : 0.12);

const self_ = this;
const mk = (label, key, opts) => ({
label,
items: opts.map((o) => {
const on = s[key] === o.v;
return { label: o.label, pressed: on ? 'true' : 'false', bg: on ? '#eef0f2' : 'transparent', fg: on ? '#0b0d10' : '#c3c9d0', pick: () => self_.setState({ [key]: o.v }) };
})
});
const groups = [
mk('容量', 'cap', [{ label: '6kW', v: 6 }, { label: '8kW', v: 8 }, { label: '12kW', v: 12 }]),
mk('天気', 'weather', [{ label: '晴れ', v: 'sun' }, { label: 'くもり', v: 'cloud' }])
];
const fmtH = (h) => { const x = h % 24; const a = Math.floor(x), b = Math.round((x - a) * 60); return a + ':' + (b < 10 ? '0' : '') + b; };
const appliances = APPL.map((a) => {
const on = isOn(a.key, hNow);
const shift = a.key === 'ev' || a.key === 'eco';
const tkey = a.key === 'ev' ? 'evTime' : 'ecoTime';
const o = s.ovr[a.key];
const manual = o && hNow >= o.from && hNow < o.to;
let state;
if (shift) {
const r = SCHED[a.key][0];
state = r ? (s[tkey] === 'day' ? '昼' : '夜') + ' ' + r[0] + '–' + r[1] + '時' + (on ? ' ・ ON' : '') : 'なし';
} else {
state = (on ? 'ON ・ ' + a.kw + ' kW' : 'OFF') + (manual ? ' ・ 〜' + fmtH(o.to) : '');
}
return {
label: shift ? a.label + '（時間帯）' : a.label, left: a.left, top: a.top, icon: a.icon,
state,
aria: shift ? a.label + 'の時間帯を切り替える' : a.label + (on ? 'を1時間オフにする' : 'を1時間オンにする'),
pressed: on ? 'true' : 'false',
bg: on ? 'rgba(255,181,71,0.16)' : 'rgba(11,14,18,0.78)',
border: on ? '#FFB547' : '#2a323c',
fg: on ? '#FFE1B0' : '#aab2bb',
iconBg: on ? '#FFB547' : '#1a2129',
toggle: shift
? () => self_.setState((st) => ({ [tkey]: a.key === 'ev' ? ({ none: 'night', night: 'day', day: 'none' })[st[tkey]] : (st[tkey] === 'day' ? 'night' : 'day') }))
: () => self_.setState((st) => {
const h0 = Math.floor(Math.min(st.hour, 23.99) * 4) / 4;
return { ovr: Object.assign({}, st.ovr, { [a.key]: { v: !on, from: h0, to: h0 + 1 } }) };
})
};
});

const er = SCHED.eco[0];
const fillRatio = hNow >= er[1] ? 1 - (hNow >= 18 ? Math.min(0.6, (hNow - 18) / 5 * 0.6) : 0) : hNow >= er[0] ? 0.3 + 0.7 * (hNow - er[0]) / (er[1] - er[0]) : 0.3;
const occupied = win(hNow, [[6, 8.5], [17.5, 23.5]]) || (home && win(hNow, [[8.5, 17.5]]));

return {
hour: H, clock, story,
groundTop: rgb(mix(13, 58, k), mix(18, 74, k), mix(24, 88, k)), groundBot: rgb(mix(5, 26, k), mix(7, 34, k), mix(10, 42, k)),
faceTop: rgb(mix(28, 150, k), mix(37, 162, k), mix(48, 176, k)), faceBot: rgb(mix(18, 104, k), mix(24, 116, k), mix(32, 130, k)),
sideA: rgb(mix(11, 70, k), mix(15, 80, k), mix(20, 94, k)), sideB: rgb(mix(23, 96, k), mix(31, 108, k), mix(40, 122, k)),
roofA: rgb(mix(30, 80, k), mix(39, 92, k), mix(49, 106, k)), roofB: rgb(mix(43, 120, k), mix(54, 134, k), mix(66, 150, k)),
roomA: rgb(mix(16, 40, k), mix(23, 52, k), mix(32, 66, k)), roomB: rgb(mix(10, 28, k), mix(15, 38, k), mix(21, 50, k)),
cloudOp: (s.weather === 'sun' ? 0.45 : 1) * Math.min(1, elev * 2),
sunBright: s.weather === 'sun' ? 1 : 0.35,
overcastOp: s.weather === 'sun' ? 0 : (0.18 * Math.min(1, elev * 2)).toFixed(2), hillFill: rgb(mix(11, 38, k), mix(16, 62, k), mix(22, 84, k)), skyTop, skyMid, skyBot, sunX, sunY,
horizonOp: (0.05 + dusk * 0.35 + (day ? 0.05 : 0)).toFixed(2),
sunOp: day ? 1 : 0, nightOp: day ? Math.max(0, 1 - elev * 6).toFixed(2) : 1,
panelGlow: (g / (cap * 0.8) * 0.45).toFixed(2),
panelGrid: grid, panelCells: cells,
roomBed: lit(isOn('bedAc', hNow)), roomDesk: lit(home && win(hNow, [[9, 18]])), roomKitchen: lit(isOn('ih', hNow)), roomLiving: lit(isOn('lvAc', hNow) || isOn('tv', hNow) || (occupied && !day)),
tvOp: isOn('tv', hNow) ? 0.55 : 0,

(function () {

  var vals = comp.renderVals();
  var binds = [];
  var HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
  function get(path, scope) {
    var parts = path.split('.');
    if (scope[parts[0]] !== undefined) parts = scope[parts[0]].split('.').concat(parts.slice(1));
    var v = vals;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    if (parts.length === 1 && (path === 'true' || path === 'false')) return path === 'true';
    return v;
  }

      HOLE.lastIndex = 0; return;
    }

    var tag = node.localName;
    if (tag === 'sc-for') {

      var list = get(lp, scope) || [];
      var frag = document.createDocumentFragment();
      var kids = Array.prototype.slice.call(node.childNodes);
      list.forEach(function (_, i) {
        var sc = Object.assign({}, scope); sc[as] = (scope[lp.split('.')[0]] ? scope[lp.split('.')[0]] + lp.slice(lp.indexOf('.')) : lp) + '.' + i;
        if (lp.indexOf('.') < 0) sc[as] = lp + '.' + i;
        kids.forEach(function (k) { var c = k.cloneNode(true); frag.appendChild(c); compile(c, sc); });
      });
      node.parentNode.replaceChild(frag, node); return;
    }
    if (tag === 'sc-if') {
      var cp = node.getAttribute('value').replace(/[{}\s]/g, '');
      node.removeAttribute('hint-placeholder-val');
      binds.push({ f: function () { node.style.display = get(cp, scope) ? 'contents' : 'none'; } });
    }
    Array.prototype.slice.call(node.attributes).forEach(function (at) {
      var name = at.name, v = at.value;
      if (name.indexOf('hint-') === 0) { node.removeAttribute(name); return; }
      if (name === 'onclick' || name === 'onchange') {
        var p = v.replace(/[{}\s]/g, ''); node.removeAttribute(name);
        node.addEventListener(name === 'onclick' ? 'click' : 'input', function (e) { var fn = get(p, scope); if (fn) fn(e); });
        return;

    });

  }

  Array.prototype.slice.call(root.childNodes).forEach(function (c) { compile(c, {}); });
  document.body.appendChild(root);
  function update() { vals = comp.renderVals(); binds.forEach(function (b) { b.f(); }); }
  var pending = false;
  window.scheduleUpdate = function () { if (pending) return; pending = true; requestAnimationFrame(function () { pending = false; update(); }); };
  update();
  function fit() {
    var st = document.getElementById('stage');

    st.style.transform = 'scale(' + sc + ')';
    st.style.left = Math.max(0, (window.innerWidth - 1440 * sc) / 2) + 'px';
    st.style.top = Math.max(0, (window.innerHeight - 900 * sc) / 2) + 'px';
  }
