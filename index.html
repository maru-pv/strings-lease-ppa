<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光熱費まるごと比較ナビ | ホーム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;
  background:#F3F4F6;color:#1F2937;line-height:1.6;
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:48px 20px 60px}

#loadingBox{text-align:center;padding:80px 20px;color:#9CA3AF;font-size:13px}

header{margin-bottom:28px;text-align:center}
h1{font-size:22px;color:#1A5EA8;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:#6B7280}
.userTag{
  display:inline-block;margin-top:12px;font-size:12px;
  background:#EFF6FF;color:#1A5EA8;padding:5px 14px;border-radius:20px;font-weight:700;
}

#menuList{display:none}

.menu-card{
  display:block;background:#fff;border-radius:14px;padding:20px 22px;
  margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  text-decoration:none;color:inherit;
  border:1.5px solid transparent;
  transition:border-color .15s ease, transform .15s ease;
}
.menu-card:hover{border-color:#1A5EA8;transform:translateY(-1px)}
.menu-card .icon{font-size:24px;margin-bottom:8px}
.menu-card .ttl{font-size:15.5px;font-weight:800;color:#111827;margin-bottom:4px}
.menu-card .desc{font-size:12.5px;color:#6B7280}

.menu-card.admin{border-color:#FDE68A;background:#FFFBEB}
.menu-card.admin .ttl{color:#92400E}

.section-label{
  font-size:11px;font-weight:800;color:#9CA3AF;letter-spacing:.05em;
  margin:22px 0 10px;text-transform:uppercase;
}
.section-label:first-of-type{margin-top:0}

.logout-link{
  display:block;text-align:center;margin-top:30px;font-size:12.5px;
  color:#9CA3AF;text-decoration:none;
}
.logout-link:hover{color:#6B7280}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme-dark.css">
<script src="theme-switch.js"></script>
<style>
/* ホーム（index）専用レイアウト */
.hm{max-width:1080px;margin:0 auto;padding:0 clamp(16px,5vw,48px) 64px}
#menuList{display:none}
.hm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;border-bottom:1px solid var(--lk-1d242c);margin-bottom:clamp(40px,8vw,88px);padding-right:170px}
.hm-mark{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;letter-spacing:.32em;color:var(--lk-e9edf1)}
.hm .userTag{font-size:12px;padding:6px 14px;border-radius:999px}
.hm-hero{display:flex;flex-direction:column;gap:14px;margin-bottom:clamp(40px,7vw,72px)}
.hm-eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--lk-ffb547)}
.hm-hero h1{margin:0;font-size:clamp(32px,5.4vw,56px) !important;line-height:1.15;letter-spacing:.01em;text-wrap:balance}
.hm-hero .sub{margin:0;font-size:clamp(14px,1.6vw,17px);line-height:1.8;max-width:34em}
.hm .section-label{font-size:12px;letter-spacing:.12em;margin:0 0 14px;font-weight:700}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-bottom:48px}
.hm-card{position:relative;display:flex;flex-direction:column;gap:10px;padding:28px 28px 30px;border-radius:20px;background:var(--lk-0b0e12);border:1px solid var(--lk-1d242c);text-decoration:none;color:var(--lk-e9edf1);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;min-height:220px}
.hm-card:hover{transform:translateY(-3px);border-color:var(--lk-ffb547);box-shadow:0 18px 40px rgba(0,0,0,.10)}
.hm-feature{background:radial-gradient(120% 120% at 0% 0%,rgba(255,181,71,.16) 0%,rgba(255,181,71,0) 55%),var(--lk-0b0e12)}
.hm-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--lk-11161c);color:var(--lk-ffb547);margin-bottom:10px}
.hm-ico.sm{width:40px;height:40px;border-radius:12px;margin:0;flex-shrink:0}
.hm-k{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--lk-8a949f)}
.hm .ttl{font-size:20px;font-weight:700;color:var(--lk-e9edf1);letter-spacing:.02em}
.hm .desc{font-size:13px;line-height:1.7;color:var(--lk-8a949f);max-width:30em}
.hm-arrow{position:absolute;right:24px;bottom:26px;color:var(--lk-8a949f);transition:transform .25s,color .25s}
.hm-card:hover .hm-arrow,.hm-row:hover .hm-arrow{transform:translateX(4px);color:var(--lk-ffb547)}
.hm-row{position:relative;display:flex;align-items:center;gap:16px;padding:18px 56px 18px 18px;border-radius:16px;background:var(--lk-0b0e12);border:1px solid var(--lk-1d242c);text-decoration:none;margin-bottom:12px;transition:border-color .25s}
.hm-row:hover{border-color:var(--lk-ffb547)}
.hm-row .hm-arrow{top:50%;bottom:auto;margin-top:-10px;right:20px}
.hm-rowtext{display:flex;flex-direction:column;gap:2px}
.hm-row .ttl{font-size:16px}
.hm .logout-link{display:inline-block;margin-top:40px;font-size:13px}
@media (prefers-reduced-motion:reduce){.hm-card,.hm-arrow{transition:none}}
</style>
</head>
<body>
<div class="hm">

  <div id="loadingBox">読み込み中…</div>

  <div id="menuList">
    <header class="hm-top">
      <span class="hm-mark">STRINGS</span>
      <div class="userTag" id="userTag"></div>
    </header>

    <section class="hm-hero">
      <span class="hm-eyebrow">営業支援ツール</span>
      <h1>光熱費まるごと比較ナビ</h1>
      <p class="sub">お客様の暮らしに合わせて、光熱費と太陽光の導入効果をその場で見せられます。</p>
    </section>

    <div class="section-label">お客様への商談で使う</div>
    <div class="hm-grid">
      <a class="hm-card hm-feature" href="navi">
        <span class="hm-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
        <span class="hm-k">比較・試算</span>
        <span class="ttl">光熱費まるごと比較ナビ</span>
        <span class="desc">電気ガス併用・オール電化・太陽光の比較から、詳細シミュレーションの依頼まで</span>
        <svg class="hm-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </a>
      <a class="hm-card" href="flow">
        <span class="hm-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="hm-k">体験</span>
        <span class="ttl">太陽光の仕組み体感ツール</span>
        <span class="desc">発電・自家消費・売電・買電の流れを、1日の時間に沿って動かして見せられます</span>
        <svg class="hm-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </a>
    </div>

    <div class="section-label">社内・打ち合わせ準備用</div>
    <a class="hm-row" href="pattern-lab">
      <span class="hm-ico sm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg></span>
      <span class="hm-rowtext"><span class="ttl">提案パターン・ラボ</span><span class="desc">お客様のタイプ別に、話し方・見せ方の型を整理できます</span></span>
      <svg class="hm-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
    </a>

    <div id="adminSection" style="display:none">
      <div class="section-label">管理者用</div>
      <a class="hm-row" href="admin">
        <span class="hm-ico sm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></span>
        <span class="hm-rowtext"><span class="ttl">取引先管理</span><span class="desc">工務店の登録、対応サービス・単価の設定</span></span>
        <svg class="hm-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </a>
    </div>

    <a class="logout-link" href="#" onclick="doLogout(); return false;">ログアウト</a>
  </div>
</div>

<script>
var SUPABASE_URL  = 'https://iqgtknxypkqfrhbktxsy.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxZ3Rrbnh5cGtxZnJoYmt0eHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzkxMzIsImV4cCI6MjA5NjQxNTEzMn0.HcLrC9LImbBpVu7nVrfV7ME3VtoRCDOQGR81DaI54LM';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

(async function init(){
  var { data: { session } } = await sb.auth.getSession();
  if(!session){
    window.location.href = 'login';
    return;
  }

  var { data: userData } = await sb.from('users')
    .select('*, companies(*)')
    .eq('id', session.user.id)
    .single();

  document.getElementById('loadingBox').style.display = 'none';
  document.getElementById('menuList').style.display = 'block';

  if(userData){
    var companyName = userData.companies ? userData.companies.name : '';
    document.getElementById('userTag').textContent =
      (userData.name || session.user.email) + (companyName ? '（' + companyName + '）' : '');

    if(userData.role === 'superadmin'){
      document.getElementById('adminSection').style.display = 'block';
    }
  } else {
    document.getElementById('userTag').textContent = session.user.email;
  }
})();

async function doLogout(){
  await sb.auth.signOut();
  window.location.href = 'login';
}
</script>
</body>
</html>
